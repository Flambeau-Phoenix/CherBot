name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install official Streamer.bot client (compat test)
        run: npm ci --prefix tests/compat-client
      - name: Restore
        run: dotnet restore CherBot.sln
      - name: Build
        run: dotnet build CherBot.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/CherBot.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"
      - name: UI coverage test
        run: node --test tests/ui
      - name: Linux installer regression test
        if: runner.os == 'Linux'
        run: bash tests/packaging/install.test.sh
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: tests/CherBot.Tests/TestResults

  publish:
    needs: build-test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish engine
        shell: pwsh
        run: ./packaging/publish.ps1 -Runtimes ${{ matrix.rid }} -NoDesktop -Zip
      - name: Publish desktop
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: ./packaging/publish.ps1 -Runtimes win-x64 -Zip
      - uses: actions/upload-artifact@v4
        with:
          name: cherbot-${{ matrix.rid }}
          path: artifacts/*.zip
